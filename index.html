<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive"><title>Roya Resort · Investor materials</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,400&family=Montserrat:wght@400;500;600&display=swap"><style>
  :root{--bone:#f4efe5;--ink:#1e1b15;--mut:#6f6a5e;--gold:#a8873b;--gold2:#d9c294;--bg:#14110f}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--bone);
    font-family:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:28px}
  .card{width:100%;max-width:420px;text-align:center}
  .eyebrow{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-bottom:22px}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:clamp(30px,8vw,44px);
    line-height:1.05;letter-spacing:.04em;text-transform:uppercase;margin:0}
  .sub{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(20px,5vw,28px);
    color:var(--gold2);margin-top:2px}
  .rule{width:56px;height:1px;margin:26px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  p.note{font-size:12px;line-height:1.7;color:#9d968a;margin:0 0 22px}
  form{display:flex;flex-direction:column;gap:12px}
  input{font:inherit;font-size:16px;padding:14px 16px;border-radius:2px;text-align:center;
    color:var(--bone);background:rgba(244,239,229,.06);border:1px solid rgba(244,239,229,.22);
    letter-spacing:.02em}
  input:focus{outline:none;border-color:var(--gold)}
  button{font:inherit;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;
    padding:14px 16px;border:0;border-radius:2px;background:var(--gold);color:#17140f;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .msg{min-height:20px;font-size:12px;margin-top:14px;color:#c78d8d}
  .prog{margin-top:14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
  .bar{height:2px;background:rgba(244,239,229,.14);margin-top:10px;border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s ease}
</style></head>
<body><div class="card"><h1>Roya Resort</h1><div class="sub">Investor materials</div><div class="rule"></div>
<p class="note">The materials are being prepared.<br>Материалы готовятся.</p></div></body></html>
